[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsidian-hybrid-rag-mcp"
version = "2.0.0"
description = "Local Hybrid RAG MCP Server for Obsidian Vaults using BAAI/bge-m3 & Jina Reranker v2"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Muhammad Pandu Dwi Cahyo", email = "mpandudc@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "rag",
    "hybrid-rag",
    "obsidian",
    "sqlite-vec",
    "bge-m3",
    "jina-reranker",
    "hybrid-search",
    "fastmcp",
    "local-ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
# Core: MCP server, index and editing tools. Keyword search works with these alone.
dependencies = [
    "fastmcp>=2.0.0",
    "sqlite-vec>=0.1.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Embedding + reranking models (semantic / hybrid search and indexing).
models = [
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "fastembed>=0.4.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/mpandudc/obsidian-hybrid-rag-mcp"
Repository = "https://github.com/mpandudc/obsidian-hybrid-rag-mcp"

[project.scripts]
vault-indexer = "obsidian_hybrid_rag_mcp.indexer:main"
vault-mcp = "obsidian_hybrid_rag_mcp.server:main"
vault-eval = "obsidian_hybrid_rag_mcp.eval:main"

[tool.hatch.build.targets.wheel]
packages = ["obsidian_hybrid_rag_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "S", "SIM", "UP", "I"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
